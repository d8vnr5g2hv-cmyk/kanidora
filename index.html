<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050816">
<title>HALO LINK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Barlow+Condensed:ital,wght@0,600;1,700;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="game.css">
</head>
<body>

<!-- ===== ホーム ===== -->
<section class="scr on" id="home">
  <div class="bg" style="background-image:url(bg_home.webp)"></div>
  <div class="hud">
    <div class="rank cut"><em>RANK</em><b data-hud="rank">1</b><i class="xp"><i data-hud="exp"></i></i></div>
    <div class="stone cut"><i class="gem"></i><b data-hud="stone">0</b></div>
  </div>
  <div class="logo">HALO<span>LINK</span></div>
  <button class="homeTap" id="homeTap" aria-label="話す"><img id="homeArt" alt=""></button>
  <div class="hname" id="homeName"></div>
  <div class="talk cut" id="talk"><p></p></div>
  <button class="homeGo cut" id="homeGo"><span>QUEST</span><b>出撃する</b></button>
</section>

<!-- ===== クエスト ===== -->
<section class="scr" id="quest">
  <div class="bg dim" style="background-image:url(bg_battle.webp)"></div>
  <div class="hud"><div class="ttl"><em>QUEST</em>ダンジョン</div><div class="stone cut"><i class="gem"></i><b data-hud="stone">0</b></div></div>
  <div class="list" id="qList"></div>
</section>

<!-- ===== 編成 ===== -->
<section class="scr" id="party">
  <div class="bg dim" style="background-image:url(bg_home.webp)"></div>
  <div class="hud"><div class="ttl"><em>PARTY</em>編成</div><button class="mini cut" id="pHome">リーダーをホームに</button></div>
  <div class="slots" id="pSlots"></div>
  <div class="pinfo" id="pInfo"></div>
  <p class="hint">枠をタップしてキャラを選びます。左端がリーダー、右端はフレンド（全キャラから選べます）。</p>
  <div class="pick" id="pPick"><div class="pickhd"><b id="pPickT"></b><button id="pPickX">閉じる</button></div><div class="pickl" id="pPickL"></div></div>
</section>

<!-- ===== ガチャ ===== -->
<section class="scr" id="gacha">
  <div class="bg" style="background-image:url(bg_gacha.webp)"></div>
  <div class="hud"><div class="ttl"><em>SUMMON</em>ガチャ</div><div class="stone cut"><i class="gem"></i><b data-hud="stone">0</b></div></div>
  <div class="gban cut"><em>PICK UP</em><b>HALO GATE</b><small>★6 出現率 10%</small></div>
  <div class="gown" id="gOwned"></div>
  <div class="gbtns">
    <button class="gb cut" id="g1"><b>1回</b><span><i class="gem"></i>5</span></button>
    <button class="gb ten cut" id="g10"><b>10連</b><span><i class="gem"></i>50</span></button>
  </div>
</section>

<!-- ===== バトル ===== -->
<section class="scr" id="battle">
  <div id="field">
    <div class="bbg" id="bBg"></div>
    <div class="bhead">
      <button class="mini cut" id="retreat">撤退</button>
      <div class="bname" id="bName"></div>
      <div class="bfloor">FLOOR <b id="bFloor">1/3</b></div>
    </div>
    <div class="bossBar" id="bossBar"><b></b><span></span><div><i></i></div></div>
    <div id="enemies"></div>
    <div id="combo"></div>
    <div id="banner"></div>
    <div id="note"></div>
    <div id="flash"></div>
  </div>
  <div class="pt" id="pt"></div>
  <div class="hpRow"><div class="hp" id="hp"><i></i><span></span></div><div class="buffs" id="buffs"></div></div>
  <div class="timer"><i id="tBar"></i><b id="tNum"></b></div>
  <canvas id="board"></canvas>
  <div class="sheet cut" id="sheet"></div>
</section>

<!-- カットイン -->
<div id="cut"><div class="cbg"></div><i class="s1"></i><i class="s2"></i><i class="s3"></i><img alt="">
  <div class="ctx"><span class="cn"></span><b class="cs"></b><p class="cd"></p></div></div>

<!-- ガチャ演出・結果・案内 -->
<div id="gx"></div>
<div class="over" id="over"></div>
<div id="toast"></div>
<div id="glitch"><i></i><i></i><i></i><i></i></div>

<!-- 下のメニュー -->
<nav id="nav">
  <button data-go="home" class="on"><i class="ic home"></i>ホーム</button>
  <button data-go="quest"><i class="ic quest"></i>クエスト</button>
  <button data-go="party"><i class="ic party"></i>編成</button>
  <button data-go="gacha"><i class="ic gacha"></i>ガチャ</button>
</nav>

<script src="data.js"></script>
<script src="save.js"></script>
<script src="sfx.js"></script>
<script src="board.js"></script>
<script src="battle.js"></script>
<script src="ui.js"></script>
</body>
</html>
